<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Marble Starter</title>
  <style>
    body {
      margin: 0;
    }

    canvas {
      touch-action: none;
    }
    #audio-panel {
      position: fixed; left: 20px; bottom: 20px; z-index: 20;
      width: 292px; max-width: calc(100vw - 40px); max-height: 60vh;
      display: flex; flex-direction: column; box-sizing: border-box;
      border: 1px solid #ffffff24; border-radius: 16px;
      background: #202020f2; color: #eee; font: 13px/1.4 system-ui;
      color-scheme: dark; accent-color: #ddd;
      box-shadow: 0 12px 40px #0005; backdrop-filter: blur(16px);
      overflow: hidden;
    }
    .audio-header { display: flex; align-items: center; gap: 8px; padding: 16px; }
    #audio-panel h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
    #audio-count { color: #999; font-size: 11px; background: #ffffff0c; padding: 2px 6px; border-radius: 5px; }
    #audio-panel button {
      cursor: pointer; border: 1px solid transparent; border-radius: 7px;
      background: #ffffff0c; color: #ddd; font: inherit;
      transition: background 120ms, border-color 120ms;
    }
    #audio-panel button:hover { background: #ffffff18; color: #fff; }
    #audio-panel #audio-upload {
      margin-left: auto; padding: 6px 11px; background: #e5e5e5; color: #222;
      font-size: 12px; font-weight: 600;
    }
    #audio-panel #audio-upload:hover { background: #fff; }
    .audio-transport { display: flex; gap: 6px; padding: 0 16px 12px; }
    #audio-panel .audio-transport button { flex: 1; padding: 6px 10px; font-size: 12px; border-color: #ffffff14; }
    #audio-panel button:disabled { opacity: 0.35; cursor: default; }
    #audio-panel :focus-visible { outline: 2px solid #ddd; outline-offset: 2px; }
    #audio-status { margin: 0; padding: 0 16px 12px; color: #bbb; font-size: 12px; overflow-wrap: anywhere; }
    #audio-status:empty { display: none; }
    #audio-list { overflow-y: auto; min-height: 0; padding: 0 10px 10px; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    #audio-list:empty::after {
      content: "Drop audio here"; display: block; text-align: center; color: #888;
      padding: 26px 12px; border: 1px dashed #ffffff24; border-radius: 9px;
    }
    .audio-source { padding: 10px; border: 1px solid #ffffff0c; border-radius: 10px; background: #ffffff04; }
    .audio-source + .audio-source { margin-top: 7px; }
    .audio-source.selected { border-color: #888; background: #ffffff0a; }
    .audio-source-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    #audio-panel .audio-name { min-width: 0; flex: 1; padding: 3px 0; text-align: left; background: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    #audio-panel .remove { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; background: none; color: #888; flex-shrink: 0; }
    #audio-panel .remove svg { width: 20px; height: 20px; }
    #audio-panel .remove:hover { background: #ffffff10; color: #fff; }
    .audio-actions { display: flex; gap: 8px; align-items: center; }
    #audio-panel .play { min-width: 62px; padding: 5px 10px; border-color: #ffffff14; font-size: 12px; }
    #audio-panel .play[aria-pressed="true"] { background: #ddd; color: #222; }
    .audio-loop { display: flex; align-items: center; gap: 5px; margin-left: auto; color: #aaa; font-size: 11px; cursor: pointer; }
    .audio-loop input { margin: 0; width: 13px; height: 13px; }
    .audio-volume { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: #888; }
    .audio-volume svg { flex-shrink: 0; }
    .audio-volume input { min-width: 0; flex: 1; height: 14px; margin: 0; cursor: pointer; }
    .audio-volume output { min-width: 30px; text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
    .audio-footer { padding: 10px 16px; border-top: 1px solid #ffffff0c; color: #888; font-size: 10px; text-align: center; }
    #audio-selection-hint {
      position: fixed; z-index: 15; pointer-events: none;
      padding: 5px 8px; border: 1px solid #666; border-radius: 5px;
      background: #242424ee; color: #eee; font: 12px/1.4 system-ui;
      white-space: nowrap; transform: translate(-50%, -100%);
    }
    #audio-drop {
      display: none; position: fixed; inset: 12px; z-index: 30;
      border: 2px dashed #aaa; border-radius: 12px; background: #222b;
      color: white; font: 24px system-ui; align-items: center; justify-content: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <section id="audio-panel" aria-label="Audio sources">
    <div class="audio-header">
      <h2>Audio</h2><span id="audio-count" aria-label="Source count">0</span>
      <button id="audio-upload" type="button" aria-label="Add audio">+ Add</button>
    </div>
    <div class="audio-transport">
      <button id="audio-play-all" type="button" disabled>Play all</button>
      <button id="audio-pause-all" type="button" disabled>Pause all</button>
    </div>
    <input id="audio-files" type="file" accept="audio/*" multiple hidden>
    <p id="audio-status" role="status">Loading…</p>
    <div id="audio-list"></div>
    <div class="audio-footer">Select orb · Drag to move · Scroll for depth</div>
  </section>
  <div id="audio-drop">Drop audio</div>
  <div id="audio-selection-hint" hidden>Drag to move · Scroll for depth</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm",
        "@sparkjsdev/spark": "./spark.module.min.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { SparkRenderer, SplatMesh, SparkControls, SparkXr, textSplats, dyno, utils } from "@sparkjsdev/spark";
    import GUI from "lil-gui";

    const RENDER_TIMEOUT_MS = 5 * 1000;
    const URL_BASE = ".";

    const scene = new THREE.Scene();
    // Soft lighting gives the audio meshes a rounded, three-dimensional shape.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x454545, 2));
    const orbLight = new THREE.DirectionalLight(0xffffff, 3);
    orbLight.position.set(3, 5, 4);
    scene.add(orbLight);
    // scene.background = new THREE.Color(0.75, 1.0, 1.0);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Make a local frame of reference that we can move to control
    // the camera, or as a frame of reference in WebXR mode
    const localFrame = new THREE.Group();
    scene.add(localFrame);

    // Lower the splat rendering width to sqrt(5) std devs for more performance
    const spark = new SparkRenderer({
      renderer,
      maxStdDev: Math.sqrt(5),
    });
    scene.add(spark);
    localFrame.add(camera);

    const stats = new Stats();
    document.body.appendChild(stats.dom);

    const gui = new GUI({ title: "Settings" });

    const scene_json = await fetch(`${URL_BASE}/scene.json`).then((response) => response.json());
    const splats = scene_json.splats ?? [];
    const meshes = scene_json.meshes ?? [];

    // Load splats
    for (const splat of splats) {
      const splatMesh = new SplatMesh({ url: `${URL_BASE}/${splat.filename}`, lod: true });
      splatMesh.position.fromArray(splat.transform?.translation ?? [0, 0, 0]);
      splatMesh.quaternion.fromArray(splat.transform?.quaternion ?? [0, 0, 0, 1]);
      const scale = splat.transform?.scale ?? 1;
      splatMesh.scale.set(scale, scale, scale);
      scene.add(splatMesh);
    }

    // Helper to extract albedo color and texture from any material
    function extractAlbedoProperties(material) {
      let color = new THREE.Color(0x888888);
      let map = null;

      if (material.color instanceof THREE.Color) {
        color = material.color.clone();
      }
      if (material.map) {
        map = material.map;
      }

      return { color, map };
    }

    // Convert mesh materials to MeshBasicMaterial (matches Marble's behavior)
    function convertToBasicMaterials(object) {
      object.traverse((child) => {
        if (child.isMesh) {
          const originalMaterial = child.material;
          const originalMaterials = Array.isArray(originalMaterial)
            ? originalMaterial
            : [originalMaterial];

          if (originalMaterials.length === 0) {
            child.material = new THREE.MeshBasicMaterial({
              color: 0x888888,
              side: THREE.DoubleSide,
            });
          } else {
            const newMaterials = originalMaterials.map((mat) => {
              const { color, map } = extractAlbedoProperties(mat);
              return new THREE.MeshBasicMaterial({
                color: color,
                map: map,
                side: THREE.DoubleSide,
              });
            });

            child.material = newMaterials.length === 1 ? newMaterials[0] : newMaterials;
          }
        }
      });
    }

    // Load meshes (GLB/GLTF)
    const gltfLoader = new GLTFLoader();
    for (const mesh of meshes) {
      try {
        const gltf = await gltfLoader.loadAsync(`${URL_BASE}/${mesh.filename}`);
        const model = gltf.scene;
        // Convert to MeshBasicMaterial to not need lighting
        convertToBasicMaterials(model);

        model.position.fromArray(mesh.transform?.translation ?? [0, 0, 0]);
        model.quaternion.fromArray(mesh.transform?.quaternion ?? [0, 0, 0, 1]);
        const meshScale = mesh.transform?.scale ?? [1, 1, 1];
        model.scale.set(meshScale[0], meshScale[1], meshScale[2]);
        scene.add(model);
      } catch (error) {
        console.warn(`Failed to load mesh: ${mesh.filename}`, error);
      }
    }

    window.THREE = THREE;
    window.scene = scene;
    window.renderer = renderer;

    window.addEventListener("resize", onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let renderEnabled = true;
    let lastMoved = 0;
    let lastPos = new THREE.Vector3().setScalar(Number.NEGATIVE_INFINITY);
    let lastDir = new THREE.Vector3();

    const controls = new SparkControls({
      canvas: renderer.domElement,
    });
    controls.pointerControls.reverseRotate = utils.isMobile();
    gui.add(controls.pointerControls, "reverseRotate").name("Reverse look").listen();
    controls.pointerControls.rotateSpeed *= 2.0;
    controls.pointerControls.slideSpeed *= 0.75;

    // Audio blobs and positions live together in IndexedDB.
    const audioStatus = document.querySelector("#audio-status");
    const audioList = document.querySelector("#audio-list");
    const fileInput = document.querySelector("#audio-files");
    const dropOverlay = document.querySelector("#audio-drop");
    const listener = new THREE.AudioListener();
    camera.add(listener);
    const audioSources = new Map();
    const playAll = document.querySelector("#audio-play-all");
    const pauseAll = document.querySelector("#audio-pause-all");
    function updateSourceCount() {
      document.querySelector("#audio-count").textContent = audioSources.size;
      playAll.disabled = pauseAll.disabled = audioSources.size === 0;
    }
    playAll.onclick = async () => {
      try {
        await listener.context.resume();
        wakeScene();
        scene.updateMatrixWorld(true);
        for (const source of audioSources.values()) {
          if (!source.sound.isPlaying) source.sound.play();
          source.updatePlayButton();
        }
      } catch (error) {
        audioStatus.textContent = "Playback failed: " + error.message;
      }
    };
    pauseAll.onclick = () => {
      for (const source of audioSources.values()) {
        if (source.sound.isPlaying) source.sound.pause();
        source.updatePlayButton();
      }
    };
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let dragging = null;
    let selectedSource = null;
    const selectionHint = document.querySelector("#audio-selection-hint");
    const selectionOutline = new THREE.Mesh(
      new THREE.SphereGeometry(0.132, 32, 24),
      new THREE.MeshBasicMaterial({
        color: 0xffffff, side: THREE.BackSide, depthWrite: false, toneMapped: false
      })
    );
    const hintPosition = new THREE.Vector3();
    const hintCameraRotation = new THREE.Quaternion();

    function updateSelectionHint() {
      selectionHint.hidden = true;
      if (!selectedSource || renderer.xr.isPresenting) return;
      // Anchor just above the orb in screen space, following camera movement.
      hintPosition.set(0, 0.2, 0)
        .applyQuaternion(camera.getWorldQuaternion(hintCameraRotation))
        .add(selectedSource.marker.position).project(camera);
      if (Math.abs(hintPosition.x) > 1 || Math.abs(hintPosition.y) > 1 ||
          Math.abs(hintPosition.z) > 1) return;
      const bounds = renderer.domElement.getBoundingClientRect();
      selectionHint.hidden = false;
      const halfWidth = selectionHint.offsetWidth / 2 + 8;
      const x = bounds.left + (hintPosition.x + 1) * bounds.width / 2;
      const y = bounds.top + (1 - hintPosition.y) * bounds.height / 2;
      selectionHint.style.left = `${Math.max(halfWidth, Math.min(innerWidth - halfWidth, x))}px`;
      selectionHint.style.top = `${Math.max(selectionHint.offsetHeight + 8, y)}px`;
    }
    let database = null;

    function wakeScene() {
      lastMoved = performance.now();
      renderEnabled = true;
    }

    function storageRequest(mode, operation) {
      return new Promise((resolve, reject) => {
        if (!database) return reject(new Error("Storage unavailable"));
        const transaction = database.transaction("sources", mode);
        const request = operation(transaction.objectStore("sources"));
        transaction.oncomplete = () => resolve(request.result);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function saveSource(source) {
      source.record.position = source.marker.position.toArray();
      try {
        await storageRequest("readwrite", store => store.put(source.record));
      } catch (error) {
        audioStatus.textContent = "Save failed. Storage unavailable or full.";
        console.warn(error);
      }
    }

    function updateRay(event) {
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.set((event.clientX - bounds.left) / bounds.width * 2 - 1,
        -(event.clientY - bounds.top) / bounds.height * 2 + 1);
      camera.updateWorldMatrix(true, false);
      raycaster.setFromCamera(pointer, camera);
    }

    async function addSource(record) {
      const buffer = await listener.context.decodeAudioData(await record.blob.arrayBuffer());
      record.color ??= new THREE.Color().setHSL(Math.random(), 1, 0.65).getHex();
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 32, 24),
        new THREE.MeshStandardMaterial({
          color: record.color, roughness: 0.35, metalness: 0,
          emissive: record.color, emissiveIntensity: 0.15
        })
      );
      marker.position.fromArray(record.position);
      const sound = new THREE.PositionalAudio(listener);
      sound.setBuffer(buffer);
      sound.setRefDistance(1);
      sound.setRolloffFactor(1);
      sound.setLoop(record.loop);
      sound.setVolume(record.volume);
      marker.add(sound);
      scene.add(marker);

      const row = document.createElement("div");
      row.className = "audio-source";
      row.innerHTML = `<div class="audio-source-head">
        <button type="button" class="audio-name" aria-pressed="false"></button>
        <button type="button" class="remove" aria-label="Remove audio" title="Remove">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg>
        </button></div><div class="audio-actions">
        <button type="button" class="play" aria-pressed="false">Play</button>
        <label class="audio-loop"><input type="checkbox" class="loop"> Loop</label>
        </div><label class="audio-volume">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 4L5 9H2v6h3l6 5zM15 8a6 6 0 010 8m3-11a10 10 0 010 14"/></svg>
          <input type="range" min="0" max="1" step="0.01" aria-label="Volume"><output></output>
        </label>`;
      const name = row.querySelector(".audio-name");
      name.textContent = record.name;
      name.title = record.name;
      name.setAttribute("aria-label", "Select " + record.name);
      const play = row.querySelector(".play");
      const loop = row.querySelector(".loop");
      const volume = row.querySelector("input[type=range]");
      loop.checked = record.loop;
      volume.value = record.volume;
      const volumeOutput = row.querySelector("output");
      volumeOutput.textContent = Math.round(record.volume * 100) + "%";
      const source = { record, marker, sound, row, updatePlayButton };
      name.onclick = () => selectSource(selectedSource === source ? null : source);
      audioSources.set(record.id, source);
      updateSourceCount();
      marker.userData.source = source;
      audioList.appendChild(row);
      const originalOnEnded = sound.onEnded.bind(sound);
      function updatePlayButton() {
        play.textContent = sound.isPlaying ? "Pause" : "Play";
        play.setAttribute("aria-pressed", String(sound.isPlaying));
      }
      sound.onEnded = () => { originalOnEnded(); updatePlayButton(); };
      play.onclick = async () => {
        try {
          await listener.context.resume();
          if (!audioSources.has(record.id)) return;
          if (sound.isPlaying) sound.pause();
          else { wakeScene(); scene.updateMatrixWorld(true); sound.play(); }
          updatePlayButton();
        } catch (error) {
          audioStatus.textContent = "Playback failed: " + error.message;
        }
      };
      loop.onchange = () => {
        record.loop = loop.checked;
        sound.setLoop(record.loop);
        saveSource(source);
      };
      volume.oninput = () => {
        sound.setVolume(Number(volume.value));
        volumeOutput.textContent = Math.round(Number(volume.value) * 100) + "%";
      };
      volume.onchange = () => { record.volume = Number(volume.value); saveSource(source); };
      row.querySelector(".remove").onclick = async () => {
        try {
          // Keep a source visible if its persisted copy could not be removed.
          if (database) await storageRequest("readwrite", store => store.delete(record.id));
          if (dragging?.source === source) finishDrag(false);
          if (selectedSource === source) selectSource(null);
          if (sound.isPlaying) sound.stop();
          sound.disconnect();
          scene.remove(marker);
          marker.geometry.dispose();
          marker.material.dispose();
          audioSources.delete(record.id);
          updateSourceCount();
          row.remove();
          wakeScene();
          audioStatus.textContent = "";
        } catch (error) {
          audioStatus.textContent = "Remove failed. Try again.";
        }
      };
      wakeScene();
      return source;
    }

    const storageReady = (async () => {
      try {
        database = await new Promise((resolve, reject) => {
          const request = indexedDB.open("marble-spatial-audio", 1);
          request.onupgradeneeded = () => request.result.createObjectStore("sources", { keyPath: "id" });
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        const records = await storageRequest("readonly", store => store.getAll());
        let failed = 0;
        for (const record of records) {
          try { await addSource(record); }
          catch (error) { failed++; console.warn("Could not restore audio", error); }
        }
        audioStatus.textContent = failed ? "Some audio could not load." : "";
      } catch (error) {
        audioStatus.textContent = "Storage unavailable. Session only.";
      }
    })();

    async function uploadFiles(files) {
      files = Array.from(files);
      // Resume during the user gesture; restored sources still start paused.
      listener.context.resume().catch(() => {});
      camera.updateWorldMatrix(true, false);
      const position = camera.getWorldPosition(new THREE.Vector3())
        .addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 2);
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
      await storageReady;
      for (const [index, file] of files.entries()) {
        if (!file.type.startsWith("audio/") && !/\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|aiff|aif|webm)$/i.test(file.name)) {
          audioStatus.textContent = "Not audio: " + file.name;
          continue;
        }
        try {
          const source = await addSource({
            id: crypto.randomUUID(), name: file.name, blob: file,
            position: position.clone().addScaledVector(right, index * 0.25).toArray(),
            loop: true, volume: 0.8
          });
          audioStatus.textContent = "";
          await saveSource(source);
        } catch (error) {
          audioStatus.textContent = "Unsupported audio: " + file.name;
        }
      }
    }
    document.querySelector("#audio-upload").onclick = () => fileInput.click();
    fileInput.onchange = () => { uploadFiles(fileInput.files); fileInput.value = ""; };
    let dragDepth = 0;
    window.addEventListener("dragenter", event => {
      if (!Array.from(event.dataTransfer.types).includes("Files")) return;
      event.preventDefault();
      dragDepth++;
      dropOverlay.style.display = "flex";
    });
    window.addEventListener("dragover", event => {
      if (Array.from(event.dataTransfer.types).includes("Files")) {
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      }
    });
    window.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) dropOverlay.style.display = "none";
    });
    window.addEventListener("drop", event => {
      event.preventDefault();
      dragDepth = 0;
      dropOverlay.style.display = "none";
      uploadFiles(event.dataTransfer.files);
    });

    // Capture marker gestures before Spark's camera controls receive them.
    const canvas = renderer.domElement;
    function selectSource(source) {
      selectionOutline.removeFromParent();
      if (selectedSource) selectedSource.marker.scale.setScalar(1);
      selectedSource = source;
      for (const item of audioSources.values()) {
        item.row.classList.toggle("selected", item === source);
        item.row.querySelector(".audio-name").setAttribute("aria-pressed", String(item === source));
      }
      if (source) {
        source.marker.scale.setScalar(1.2);
        source.marker.add(selectionOutline);
      }
      updateSelectionHint();
      wakeScene();
    }
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") { finishDrag(); selectSource(null); }
    });
    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0 || dragging) return;
      updateRay(event);
      scene.updateMatrixWorld(true);
      const hit = raycaster.intersectObjects(Array.from(audioSources.values(), source => source.marker), false)[0];
      if (!hit) { selectSource(null); return; }
      event.preventDefault();
      event.stopImmediatePropagation();
      const source = hit.object.userData.source;
      selectSource(source);
      const normal = camera.getWorldDirection(new THREE.Vector3());
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, source.marker.position);
      const point = raycaster.ray.intersectPlane(plane, new THREE.Vector3());
      if (!point) return;
      dragging = { source, plane, normal, offset: source.marker.position.clone().sub(point), pointerId: event.pointerId };
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor = "grabbing";
      wakeScene();
    }, true);
    canvas.addEventListener("pointermove", event => {
      if (!dragging || event.pointerId !== dragging.pointerId) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      updateRay(event);
      const point = raycaster.ray.intersectPlane(dragging.plane, new THREE.Vector3());
      if (point) dragging.source.marker.position.copy(point).add(dragging.offset);
      wakeScene();
    }, true);
    function finishDrag(save = true) {
      if (!dragging) return;
      const { source, pointerId } = dragging;
      dragging = null;
      if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
      canvas.style.cursor = "";
      if (save) saveSource(source);
      wakeScene();
    }
    for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
      canvas.addEventListener(type, event => {
        if (!dragging || event.pointerId !== dragging.pointerId) return;
        event.stopImmediatePropagation();
        finishDrag();
      }, true);
    }
    canvas.addEventListener("wheel", event => {
      const source = selectedSource;
      if (!source) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const cameraPosition = camera.getWorldPosition(new THREE.Vector3());
      const direction = source.marker.position.clone().sub(cameraPosition);
      const distance = direction.length();
      if (distance < 0.001) return;
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      const nextDistance = THREE.MathUtils.clamp(distance * Math.exp(THREE.MathUtils.clamp(delta * 0.002, -1, 1)), 0.2, 100);
      source.marker.position.copy(cameraPosition).addScaledVector(direction, nextDistance / distance);
      if (dragging) {
        dragging.plane.setFromNormalAndCoplanarPoint(dragging.normal, source.marker.position);
        updateRay(event);
        const point = raycaster.ray.intersectPlane(dragging.plane, new THREE.Vector3());
        if (point) dragging.offset.copy(source.marker.position).sub(point);
      }
      saveSource(source);
      wakeScene();
    }, { capture: true, passive: false });

    const xr = new SparkXr({
      renderer,
      onMouseLeaveOpacity: 0.5,
      onReady: async (supported) => {
        console.log(`SparkXr initialized: XR ${supported ? "supported" : "not supported"}`);
      },
      onEnterXr: () => {
        console.log("Enter XR");
      },
      onExitXr: () => {
        console.log("Exit XR");
      },
      // enableHands: true,
      controllers: {
        // moveHeading: true,
      },
    });

    // localFrame.add(xr.makeJointSplats(SparkXr.Hand.left));
    // localFrame.add(xr.makeJointSplats(SparkXr.Hand.right));

    let lastTime = 0;
    let rotation = 0;
    let xrTime = 0;

    // gui.add({ disableRender: () => {
    //   renderEnabled = false;
    //   console.log("Render disabled");
    // } }, "disableRender").name("Disable render");

    gui.add(spark, "lodSplatScale", 0.001, 3.0, 0.001);

    document.addEventListener("keydown", (event) => {
      if (event.key === "\\") {
        const cameraPos = camera.getWorldPosition(new THREE.Vector3());
        const cameraQuat = camera.getWorldQuaternion(new THREE.Quaternion());
        console.log("camera position: ", JSON.stringify(cameraPos.toArray()), "quaternion: ", JSON.stringify(cameraQuat.toArray()));
      }
    });

    renderer.setAnimationLoop(function animate(time, xrFrame) {
      stats.begin();

      const deltaTime = time - (lastTime || time);
      lastTime = time;

      xr.updateControllers(camera);
      if (!dragging) controls.update(localFrame, camera);

      const now = performance.now();
      const dir = camera.getWorldDirection(new THREE.Vector3());
      const cameraPosition = camera.getWorldPosition(new THREE.Vector3());
      if ((cameraPosition.distanceTo(lastPos) > 0.0001) || (dir.dot(lastDir) < 0.9999)) {
        lastMoved = now;
        if (!renderEnabled) {
          console.log("Render enabled");
        }
        renderEnabled = true;
        lastPos.copy(cameraPosition);
        lastDir.copy(dir);
      }
      if ((now - lastMoved) > RENDER_TIMEOUT_MS) {
        if (renderEnabled) {
          console.log("Render disabled");
        }
        renderEnabled = false;
      }

      if (renderEnabled) {
        renderer.render(scene, camera);
      }

      updateSelectionHint();
      stats.end();
    });
  </script>
</body>
